eriods, SE4 beats the 7-day mean at every flexibility level and SE3 for an eight-hour day.","Measured against a professional day-ahead price forecast rather than a rule of thumb, the forecasts are ahead in SE1, SE2 and SE4 (SE4 for an eight-hour day), and level in SE3 - so in SE3 nothing is claimed against a buyer who already has a price forecast.","FCR-D down: no spike alert (no better than persistence) and the hold call does not beat always selling in auction 2.","Auction 1 prices: the weakest error reduction of the FCR series (20-25%); the hold call rests mostly on the auction-2 view.","aFRR capacity prices are not forecast. Forecasts are hourly; day-ahead trades in 15-minute periods since 1 Oct 2025 and we forecast the hourly average."],"properties":[{"heading":"Only the shape of the day matters for a store","text":"A store that must deliver the same heat each day buys the same total energy whatever the prices are. So the level of a price forecast cannot change the schedule: adding 100 SEK/MWh to every hour, or scaling the whole day, leaves the chosen hours identical. What changes the answer is the order and the relative size of the hours - which is what this model is built to get right, and what it is measured on."},{"heading":"A fuller tank is worth more than a lower average error","text":"The schedule is decided once, before the day starts, and the tank can only hold so much. Being close on average matters less than being right about which hours to fill in - an error that moves the cheapest hours costs money even when the average is good."}],"notes":{"metrics":"Only hours unpublished at issue time are scored. Naive = same hour on the most recent known day.","intervals":"The likely range is measured from how far the forecasts have actually missed at the same hour of day over the last 90 days; the first 30 days after a series starts have no range.","spike":"Flag when forecast exceeds the trailing 90-day 90th percentile of realised prices. The section stays down   const n = V.length; const FLOOR = -0.5; const raw = pick.map(s => V.map(v => v.windows[win] && v.windows[win][s] ? v.windows[win][s].skill : null));
  const series = pick.map((s, i) => ({ values: raw[i].map(x => x == null ? null : Math.max(FLOOR, x)), color: colors[i], width: 2 }));
  const clipped = raw.flatMap((r, i) => r.map((x, j) => x != null && x < FLOOR ? [j, FLOOR, `${sname(pick[i])} ${pct(x)}`] : null).filter(Boolean));
  const ch = lineChart({ n, height: 280, label: "error reduction by version", yFmt: v => pct(v), range: [FLOOR - 0.05, 0.55], series, xLabels: V.map((v, i) => [i, v.version]), notes: clipped });

  const gmean = (v, ss) => { const k = ss.map(s => v.windows[win] && v.windows[win][s] ? v.windows[win][s].skill : null).filter(x => x !== null); return k.length ? k.reduce((a, b) => a + b, 0) / k.length : null; };

  const table = vcols.map(v => `<tr><td class="num"><b>${H(v.version)}</b> <span style="color:var(--muted);font-size:12px">${H(v.date.slice(0, 10))}</span></td>${Object.keys(GROUPS).map(g => { const m = gmean(v, GROUPS[g]); return `<td class="n">${m === null ? "–" : pct(m)}</td>`; }).join("")}</tr>`).join("");
  const perSeries = allSeries.map(s_ => `<tr><td>${H(sname(s_))}</td>${vcols.map((v, k) => { const c = v.windows[win] && v.windows[win][s_]; const prev = vcols[k + 1] && vcols[k + 1].windows[win] && vcols[k + 1].windows[win][s_]; const moved = c && prev && Math.abs(c.skill - prev.skill) > 0.005; return `<td class="n" style="${moved ? "" : "color:var(--muted);font-weight:500"}">${c ? pct(c.skill) : "–"}</td>`; }).join("")}</tr>`).join("");
  const last4 = V.slice(-4); const steps = last4.map((v, i) => `<div class="step"><span class="t">${H(v.version)}</span><span class="cap" style="color:${i === last4.length - 1 ? "var(--mint)" : "var(--acc)"}">${H(dayName(v.date.slice(0, 10)))}</span><span class="d">${pick[0] && v.windows[win] && v.windows[win][pick[0]] ? `${H(sname(pick[0]))} ${pct(v.windows[win][pick[0]].skill)} · ` : ""}spot ${gmean(v, GROUPS.Spot) == null ? "–" : pct(gmean(v, GROUPS.Spot))} · FCR ${gmean(v, GROUPS.FCR) == null ? "–" : pct(gmean(v, GROUPS.FCR))}</span></div>`).join("");
  const T = D.timeline; const tkeys = T ? ["power_price_SE3", "fcr_n_a2", "fcr_d_down_a2", "mfrr_cm_up"].filter(k => T[k] && Object.keys(T[k]).length) : [];
  const monthsTbl = tkeys.length ? (() => { const months = [...new Set(tkeys.flatMap(k => Object.keys(T[k])))].sort();
    return det("me-months", "Month by month, backtest to live", `<div class="tablewrap"><table><thead><tr><th>Month</th>${tkeys.map(k => `<th class="n">${H(sname(k))}</th>`).join("")}</tr></thead><tbody>${months.map(mo => { const cell = tkeys.map(k => T[k][mo]).find(Boolean) || {}; const [mo0, ver] = mo.split(" · "); return `<tr><td>${H(mon(mo0 + "-01"))}${ver ? ` <span style="color:var(--muted)">${H(ver)}</span>` : ""}${cell.source === "live" ? ' <span class="cap" style="color:var(--acc);font-size:10px">live</span>' : ""}</td>${tkeys.map(k => { const c = T[k][mo]; if (!c) return "<td></td>"; const sk = 1 - c.mae_model / c.mae_naive; return `<td class="n ${sk > 0 ? "up" : "down"}">${pct(sk)}</td>`; }).join("")}</tr>`; }).join("")}</tbody></table></div>`); })() : "";
  const srows = Object.keys(D.series).map(k => { const b = D.series[k]; return `<tr><td>${H(sname(k))}</td><td class="n">${fmt(b.mae_model, 1)}</td><td class="n">${fmt(b.mae_naive, 1)}</td><td class="n"><span class="${b.skill > 0 ? "up" : "down"}">${b.skill > 0 ? "−" : "+"}${pct(Math.abs(b.skill))}</span></td></tr>`; }).join("");
  root.innerHTML = band("Method", "One rule, every version.") + tickerHtml() + `
    <section class="wrap">${head("Versions", "Each one gated before adoption.", tabsHtml("vwin", ["A", "B", "C"].map(w => [w, winLabel(w)]), win, "ss.vwin"))}
      <div class="timeline"><div class="track"></div>${steps}</div>
      <div class="box" style="margin-top:24px">${legend(pick.map((s, i) => [colors[i], sname(s)]))}<div class="chart" id="ver-chart">${ch.svg}</div><div class="plot-foot"><span class="cap">Error reduction vs same-as-yesterday, ${H(winLabel(win))}</span><span class="cap">Same hours, same rule, every version</span></div></div>
      ${det("me-groups", "By market group", `<div class="tablewrap"><table><thead><tr><th>Version</th><th class="n">Spot</th><th class="n">FCR</th><th class="n">mFRR</th></tr></thead><tbody>${table}</tbody></table></div>`)}
      ${det("me-series", "Every market, every version", `<div class="tablewrap"><table><thead><tr><th>Market</th>${vcols.map(v => `<th class="n">${H(v.version)}</th>`).join("")}</tr></thead><tbody>${perSeries}</tbody></table></div><div class="note">Bold where a version moved a market by more than half a point.</div>`)}</section>
    <section class="wrap">${head(`Backtest · ${H(winLabel(D.window))}`, "Error per hour, ours vs same-as-yesterday.")}
      <div class="tablewrap"><table><thead><tr><th>Series</th><th class="n">Error, ours</th><th class="n">Same as yesterday</th><th class="n">Reduction</th></tr></thead><tbody>${srows}</tbody></table></div>${monthsTbl}
      ${det("me-def", "The rule", `${H(D.notes.metrics)} ${H(D.notes.intervals)} ${H(D.notes.spike)} Adoption: nine rolling two-month folds; adopt when the pooled interval excludes zero, at least six of nine folds improve, no fold is significantly worse beyond 1%, and the sign holds after dropping the top 1, 3 and 5 spike days per fold. Every forecast is hashed, timestamped by an independent authority before the market gate and committed to a public repository.`)}
      ${D.properties && D.properties.length ? det("me-props", "What the forecast can and cannot change", D.properties.map(p => `<p style="margin:0 0 12px"><b style="color:var(--ink)">${H(p.heading)}.</b> ${H(p.text)}</p>`).join("")) : ""}</section>`;
  attachHover(root.querySelector("#ver-chart"), n, i => `<b>${H(V[i].version)} · ${H(V[i].date.slice(0, 10))}</b><br>${pick.map((s, k) => `${sname(s)}: ${raw[k][i] == null ? "–" : pct(raw[k][i])}`).join("<br>")}`);
}

// ---------- Page: experiments (the forecast tracks side by side on identical days) ----------
// one look per track, distinct in colour AND stroke so they read apart on a phone: Compass solid teal, Echo gold long dash, Scout violet short dash
const TRACK_STYLE = { compass: { color: "var(--acc)", width: 3 }, echo: { color: "var(--gold)", width: 2, dash: "8 4" }, scout: { color: "var(--violet)", width: 2, dash: "3 3" } };
const trackStyle = id => TRACK_STYLE[id] || { color: "var(--blue)", width: 2, dash: "5 4" };
const trackColor = id => trackStyle(id).color;
// a legend whose entries switch lines on and off; the hidden set lives in window.__<set>
const legendToggle = (set, items, hidden) => `<div class="legend">${items.map(([id, c, t, dash]) => `<button type="button" class="lg" data-lgset="${H(set)}" data-lg="${H(id)}" aria-pressed="${!hidden[id]}" style="${hidden[id] ? "opacity:.35" : ""}"><i class="sw" style="background:${c};${dash ? "height:0;border-top:2px dashed " + c + ";background:none" : ""}"></i>${H(t)}</button>`).join("")}</div>`;
function renderExperiments(root) {
  const X = D.experiments;
  if (!X || !X.tracks) { root.innerHTML = band("Experiments", "No experiments on the record yet."); return; }
  const tracks = X.tracks, byId = Object.fromEntries(tracks.map(t => [t.id, t])); const main = byId[X.main]; const shadows = tracks.filter(t => t.kind === "shadow");
  const keys = Object.keys(X.series || {}); const cs = X.series[sel("expSeries", "", "")] ? sel("expSeries", "", "") : (X.series.power_price_SE3 ? "power_price_SE3" : keys[0]);
  const range = sel("expRange", "", "7d"); const hidden = window.__expHidden || (window.__expHidden = {});
  const tname = id => byId[id] ? byId[id].name : id;
  const S = X.series[cs]; const Hs = S && S.history && S.history.length ? S.history : (S && S.latest ? [S.latest] : []); let chart = "", n = 0;
  if (Hs.length) {
    const days = { "1d": 1, "7d": 7, "all": Hs.length }[range] || 7; const days_ = Hs.slice(-days); n = days_.reduce((a, d) => a + d.hours_local.length, 0);
    const cat = f => days_.flatMap(f); const re = cat(d => d.realised), nv = cat(d => d.naive), mn = cat(d => d.main);
    const tids = [...new Set(days_.flatMap(d => Object.keys(d.tracks)))];
    const tv = Object.fromEntries(tids.map(id => [id, cat(d => d.tracks[id] ? d.tracks[id].forecast : d.hours_local.map(() => null))]));
    // version cuts: the first hour of a day whose Compass version, or whose track version, differs from the day before
    const cuts = []; let at = 0;
    days_.forEach((d, k) => { if (k) { const p = days_[k - 1]; if (d.main_version && p.main_version && d.main_version !== p.main_version) cuts.push([at, `${main.name} ${d.main_version}`]);
      tids.forEach(id => { const a = d.tracks[id], b = p.tracks[id]; if (a && b && a.version !== b.version) cuts.push([at, `${tname(id)} ${a.version}`]); }); } at += d.hours_local.length; });
    const ser = []; const items = [["realised", "var(--ink)", "What cleared"], [X.main, trackColor(X.main), main.name]];
    tids.forEach(id => items.push([id, trackColor(id), tname(id), true])); items.push(["naive", "var(--muted)", "Same as yesterday", true]);
    if (!hidden.naive) ser.push({ values: nv, ...NAIVE });
    if (!hidden[X.main]) ser.push({ values: mn, ...trackStyle(X.main), role: "fc" });
    tids.forEach(id => { if (!hidden[id]) ser.push({ values: tv[id], ...trackStyle(id) }); });
    if (!hidden.realised) ser.push({ values: re, color: "var(--ink)", width: 2.5, role: "act" });
    const lab = i => { let k = 0, off = i; while (off >= days_[k].hours_local.length) { off -= days_[k].hours_local.length; k++; } return days_.length === 1 ? days_[k].hours_local[off] : `${dayName(days_[k].target_date).replace(/^\w+ /, "")} ${days_[k].hours_local[off]}`; };
    const xl = days_.length === 1 ? [0, 6, 12, 18, n - 1].filter(i => i < n) : [0, Math.floor(n / 3), Math.floor(2 * n / 3), n - 1].filter((v, i, a) => a.indexOf(v) === i);
    const ch = ser.length ? lineChart({ n, height: 300, label: "tracks vs realised", yFmt: v => fmt(v, 0), series: ser, vlines: cuts, xLabels: xl.map(i => [i, lab(i)]) }).svg : `<div class="empty">Every line is switched off.</div>`;
    const last = days_[days_.length - 1];
    chart = `<div class="box">${legendToggle("expHidden", items, hidden)}<div class="chart" id="exp-chart">${ch}</div><div class="plot-foot"><span class="cap">${days_.length === 1 ? (last.hours_realised >= n ? "Scored" : "Clearing") : `${days_.length} days`}${cuts.length ? " · dashed verticals: a version changed" : ""} · click a legend entry to hide it</span><span class="cap">${H(S.unit)}</span></div></div>`;
    setTimeout(() => { const el = document.getElementById("exp-chart"); if (el && ser.length) attachHover(el, n, i => `<b>${H(lab(i))}</b><br>realised ${re[i] == null ? "pending" : fmt(re[i], 1)} · ${H(main.name)} ${fmt(mn[i], 1)}${tids.map(id => tv[id][i] == null ? "" : ` · ${H(tname(id))} ${fmt(tv[id][i], 1)}`).join("")} · yesterday ${nv[i] == null ? "–" : fmt(nv[i], 1)}`); }, 0);
  }
  const cells = tracks.map(t => `<div><span class="cap" style="color:${t.kind === "main" ? "var(--acc)" : "var(--muted)"}">${t.kind === "main" ? "Main line" : "Shadow track"} · since ${H(dayName(t.since).replace(/^\w+ /, ""))}</span><span class="big" style="font-size:clamp(34px,3vw,48px)"><i class="sw" style="background:${trackColor(t.id)};width:14px;height:14px"></i>${H(t.name)} <span style="font-size:.4em;color:var(--muted);letter-spacing:0">${H(t.version)}</span></span><span class="sub">${t.n_days} issue${t.n_days === 1 ? "" : "s"}${t.kind === "main" ? "" : ` beside ${H(main.name)}, ${t.series.length} series`}</span></div>`).join("");
  const pair = (a, b, f) => a == null || isNaN(a) ? "–" : `<span class="${b != null && !isNaN(b) && a < b ? "up" : b != null && !isNaN(b) && a > b ? "down" : ""}">${f(a)}</span> <span style="color:var(--muted);font-weight:500">/ ${f(b)}</span>`;
  const rows = keys.flatMap(k => { const Sr = X.series[k]; const shp = /^power_price/.test(k);
    return shadows.filter(t => Sr.tracks[t.id]).map(t => { const r = Sr.tracks[t.id];
      return `<tr><td>${H(Sr.name)}</td><td><i class="sw" style="background:${trackColor(t.id)}"></i>${H(t.name)} ${H(r.version)}</td><td class="n">${r.n}</td><td class="n">${pair(r.mae, r.mae_main, v => fmt(v, 1))}</td><td class="n">${r.skill == null ? "–" : `<span class="${r.skill > r.skill_main ? "up" : "down"}">${r.skill > 0 ? "−" : "+"}${pct(Math.abs(r.skill))}</span> <span style="color:var(--muted);font-weight:500">/ ${r.skill_main > 0 ? "−" : "+"}${pct(Math.abs(r.skill_main))}</span>`}</td><td class="n">${shp ? `${fmt(r.top4, 1)} <span style="color:var(--muted);font-weight:500">/ ${fmt(r.top4_main, 1)}</span>` : ""}</td></tr>`; }); }).join("");
  const dayRows = S ? S.days.map(d => `<tr><td>${H(dayName(d.target_date))}</td><td><i class="sw" style="background:${trackColor(d.track)}"></i>${H(tname(d.track))} ${H(d.version)}</td><td class="n">${d.hours_realised}</td><td class="n">${pair(d.mae, d.mae_main, v => fmt(v, 1))}${d.main_version ? ` <span style="font-size:11px;color:var(--muted)">${H(d.main_version)}</span>` : ""}</td><td class="n">${fmt(d.mae_naive, 1)}</td></tr>`).join("") : "";
  root.innerHTML = band("Experiments · same days, same hours", "Other ways of forecasting, beside the main line.") + tickerHtml() + `
    <section class="wrap"><div class="proof three">${cells}</div></section>
    <section class="wrap">${head("Track by track", S ? `${H(S.name)}, ${range === "1d" ? H(dayName(Hs[Hs.length - 1].target_date)) : range === "7d" ? "last seven days" : "every day"}.` : "", tabsHtml("expRange", [["1d", "1d"], ["7d", "7d"], ["all", "All"]], range))}
      <div class="tabrows" style="margin-bottom:14px">${tabsHtml("expSeries", keys.map(k => [k, X.series[k].name]), cs)}</div>${chart}
      ${S ? det("expdays", `Day by day, ${H(S.name)}`, `<div class="tablewrap"><table><thead><tr><th>Delivery day</th><th>Track</th><th class="n">Hours cleared</th><th class="n">Error, track / ${H(main.name)}</th><th class="n">Error, yesterday</th></tr></thead><tbody>${dayRows}</tbody></table></div>`) : ""}</section>
    <section class="wrap">${head("Series by series", `Each shadow against ${H(main.name)}, same days.`)}
      <div class="tablewrap"><table><thead><tr><th>Series</th><th>Track</th><th class="n">Days</th><th class="n">Error, track / ${H(main.name)}</th><th class="n">vs yesterday</th><th class="n">Cheapest 4 named</th></tr></thead><tbody>${rows || `<tr><td colspan="6" style="color:var(--muted)">No scored days yet.</td></tr>`}</tbody></table></div>
      ${det("exphow", "How to read this page", `Each cell pairs the track with ${H(main.name)} on the same days; green marks the lower error of the pair. Error is the mean absolute error per hour over the delivery day, "vs yesterday" the reduction against same-as-yesterday on those days, "cheapest 4 named" how many of the day's four cheapest hours were picked. ${H(X.how)} A shadow track is stored, hashed and timestamped like the main issue and released under the same rule, but nothing it says reaches the forecast pages.`)}</section>`;
}

// ---------- Page: home (only when the explorer is the front page, i.e. a build without the live home page) ----------
function renderHome(root) {
  const S = D.series.power_price_SE3; const L = D.live; const s3 = L && L.series_skill && L.series_skill.power_price_SE3;
  const FP = forecastPanel("power_price_SE3", { height: 300 });
  root.innerHTML = `<div class="band-row" style="margin-bottom:32px"><div class="hd"><div class="cap" style="color:var(--acc)">Day-ahead forecasts · Swedish electricity markets</div><h1>Tomorrow's price, before the gate.</h1></div>${L && L.issues && L.issues.length ? liveCap(`Live since ${H(sinceTxt(L))}`) : `<span class="cap">Backtest · ${H(winLabel(D.window))}</span>`}</div>${FP.html}
    <div class="proof" style="margin-top:32px"><div><span class="big huge">${s3 && s3.hours >= 24 ? "−" + pct(Math.abs(s3.skill)) : S ? "−" + pct(Math.abs(S.skill)) : "–"}</span><span class="lbl">Less error</span><span class="sub">than same-as-yesterday, spot SE3${s3 && s3.hours >= 24 ? ", live" : ", backtest"}</span></div>
      <div><span class="big">${L ? (L.n_issues != null ? L.n_issues : L.issues.length) : 0}</span><span class="lbl">Issues</span><span class="sub">timestamped before the gate</span></div>
      <div><span class="big">${fmt(L && L.scored_hours || (S ? S.n_cells : 0))}</span><span class="lbl">Hours scored</span><span class="sub">${L && L.scored_hours ? "live" : "backtest"}</span></div>
      <div><span class="big">${Object.keys(D.series).length}</span><span class="lbl">Markets</span><span class="sub">four spot areas, ten reserve series</span></div></div>
    <div style="margin-top:32px;display:flex;gap:20px;flex-wrap:wrap;align-items:center"><a class="btn" href="#record">See every issue →</a><a href="#forecasts">All markets</a><a href="#value">Value</a><a href="#experiments">Experiments</a></div>`;
  setTimeout(FP.wire, 0);
}

// ---------- shell: hash routes (#home, #forecasts, #record, #value, #method, #experiments); each page's data is fetched on first visit ----------
let routing = 0;
async function route(opts = {}) {
  page = pageFromHash(); const my = ++routing;
  document.querySelectorAll("#nav a[data-p]").forEach(a => a.classList.toggle("on", a.dataset.p === page));
  const home = document.getElementById("home-page"), app = document.getElementById("app");
  if (page === "home") { app.hidden = true; app.innerHTML = ""; home.hidden = false; renderHome(home); }
  else {
    home.hidden = true; app.hidden = false;
    if (!LOADED[page]) app.innerHTML = '<div class="wrap empty">Loading…</div>';
    try { Object.assign(D, await need(page)); } catch (e) { app.innerHTML = `<div class="wrap empty">This page's data could not be loaded (${H(e.message)}). Reload to try again.</div>`; return; }
    if (my !== routing) return;
    ({ record: renderLive, forecasts: renderTomorrow, value: renderEarnings, method: renderMethod, experiments: renderExperiments }[page] || renderHome)(app);
  }
  observeCharts();   // every chart plays its draw sequence when it scrolls into view
  // every tab strip works the same way: remember the choice (and persist it when the strip says so), then redraw the page
  document.querySelectorAll(".tab[data-set]").forEach(b => b.addEventListener("click", () => { window["__" + b.dataset.set] = b.dataset.val; if (b.dataset.store) { try { localStorage.setItem(b.dataset.store, b.dataset.val); } catch (x) {} } render(); }));
  document.querySelectorAll(".lg[data-lgset]").forEach(b => b.addEventListener("click", () => { const hs = window["__" + b.dataset.lgset] || (window["__" + b.dataset.lgset] = {}); hs[b.dataset.lg] = !hs[b.dataset.lg]; render(); }));
  document.querySelectorAll("details[data-k]").forEach(d => d.addEventListener("toggle", () => { OPEN[d.dataset.k] = d.open; }));
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  document.querySelectorAll("[data-trial]").forEach(a => { if (!a.dataset.wired) { a.dataset.wired = "1"; a.addEventListener("click", () => { if (window.goatcounter && goatcounter.count) goatcounter.count({ path: "trial-click", title: "Shadow trial request (click)", event: true }); }); } });
  if (window.goatcounter && goatcounter.count && opts.count !== false) goatcounter.count({ path: location.pathname + "#" + page, title: document.title + (page === "home" ? "" : " · " + page) });
  document.getElementById("foot").textContent = `Model ${cur.version} · page built ${D.built_at.slice(0, 16).replace("T", " ")}${D.mode === "backtest" ? ` · backtest ${winLabel(D.window)}` : ""}`;
  if (!opts.keepScroll) window.scrollTo(0, 0);
}
const render = () => route({ keepScroll: true, count: false });
window.addEventListener("hashchange", () => route());
let wasMobile = MOBILE(); window.addEventListener("resize", () => { if (MOBILE() !== wasMobile) { wasMobile = MOBILE(); render(); } });
if (!D) { document.getElementById("main").innerHTML = '<div class="wrap empty">No data embedded. Run scripts/dashboard/build_dashboard.py.</div>'; } else { route(); }
</script>
</body>
